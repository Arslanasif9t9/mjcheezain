<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .sidebar-item:hover { background-color: #f8fafc; color: #ef4444; }
        .sidebar-active { color: #f97316; border-left: 3px solid #f97316; background-color: #fffafb; }
    </style>
</head>
<body class="p-4 md:p-10 flex justify-center items-start min-h-screen">

    <div class="bg-white w-full max-w-6xl rounded-xl shadow-lg flex flex-col md:flex-row overflow-hidden border border-gray-100">
        
        <aside class="w-full md:w-64 bg-[#f8fafc] border-r border-gray-200 flex flex-col">
            <div class="p-6 flex items-center gap-3">
                <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white">
                    <i data-lucide="user"></i>
                </div>
                <div class="space-y-1">
                    <div class="h-2 w-16 bg-gray-300 rounded"></div>
                    <div class="h-2 w-12 bg-gray-200 rounded"></div>
                </div>
            </div>

            <nav class="flex-1 px-2 space-y-1">
                <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 text-gray-600 rounded-md transition-all">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> <span class="text-sm font-medium">Dashboard</span>
                </a>
                <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 text-gray-600 rounded-md transition-all">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i> <span class="text-sm font-medium">Orders</span>
                </a>
                <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 text-gray-600 rounded-md transition-all">
                    <i data-lucide="heart" class="w-5 h-5"></i> <span class="text-sm font-medium">Wishlist</span>
                </a>
                <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 text-gray-600 rounded-md transition-all">
                    <i data-lucide="mail" class="w-5 h-5"></i> <span class="text-sm font-medium">Messages</span>
                </a>
                <a href="#" class="sidebar-active flex items-center gap-3 px-4 py-3 transition-all">
                    <i data-lucide="bell" class="w-5 h-5"></i> <span class="text-sm font-semibold">Notifications</span>
                </a>
                <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 text-gray-600 rounded-md transition-all">
                    <i data-lucide="map-pin" class="w-5 h-5"></i> <span class="text-sm font-medium">Addresses</span>
                </a>
                <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 text-gray-600 rounded-md transition-all">
                    <i data-lucide="wallet" class="w-5 h-5"></i> <span class="text-sm font-medium">My Wallet</span>
                </a>
                <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 text-gray-600 rounded-md transition-all border-t border-gray-100 mt-2">
                    <i data-lucide="settings" class="w-5 h-5"></i> <span class="text-sm font-medium">Account Settings</span>
                </a>
                <a href="#" class="sidebar-item flex items-center gap-3 px-4 py-3 text-gray-600 rounded-md transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i> <span class="text-sm font-medium">Logout</span>
                </a>
            </nav>
        </aside>

        <main class="flex-1 p-8 bg-white">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Notifications</h1>
                    <p class="text-gray-500 text-sm">Stay updated with the latest alerts.</p>
                </div>
                <div class="flex items-center gap-4">
                    <button class="text-gray-600 text-sm flex items-center gap-1 hover:text-gray-900">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-blue-900"></i> Mark All as Read
                    </button>
                    <button class="flex items-center gap-2 border border-gray-200 px-3 py-1.5 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                        <i data-lucide="settings" class="w-4 h-4"></i> Notification Settings <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div id="notifications-container" class="space-y-4">
                </div>
        </main>

    </div>

    <script>
        const notifications = [
            {
                type: 'order',
                title: 'Order #12345 has been shipped!',
                desc: 'Your order is on its way. Track your delivery now.',
                time: '5 mins ago',
                icon: 'check-circle',
                iconBg: 'bg-emerald-500',
                dotColor: 'bg-orange-400',
                action: 'View Details'
            },
            {
                type: 'offer',
                title: 'Special Offer: 20% Off on Electronics!',
                desc: 'Limited time deal just for you. Shop now!',
                time: '30 mins ago',
                icon: 'gift',
                iconBg: 'bg-orange-500',
                dotColor: 'bg-orange-400',
                action: 'View Details'
            },
            {
                type: 'review',
                title: 'New Review Added: <span class="text-red-500 italic font-medium">"Great product, fast delivery!"</span>',
                desc: 'A new review has been posted on your recent purchase.',
                time: '1 hour ago',
                icon: 'star',
                iconBg: 'bg-rose-500',
                dotColor: 'bg-red-500',
                action: 'Read More'
            },
            {
                type: 'sale',
                title: 'Flash Sale Alert!',
                desc: 'Hurry up! Up to 50% off on selected items for the next 24 hours!',
                time: '3 hours ago',
                icon: 'bell',
                iconBg: 'bg-orange-400',
                dotColor: 'bg-orange-400',
                action: 'Read More'
            },
            {
                type: 'wallet',
                title: 'Wallet Update: Rs. 500 added to your wallet.',
                desc: 'You have received a cashback of Rs. 500.',
                time: 'Yesterday',
                subTime: '4 hours ago',
                icon: 'file-text',
                iconBg: 'bg-blue-800',
                dotColor: 'bg-red-500',
                action: 'Yesterday'
            },
            {
                type: 'delay',
                title: 'Delivery Delayed: Your order #11222 is delayed.',
                desc: 'We apologize for the inconvenience. New ETA: 2 days.',
                time: '2 days ago',
                subTime: '2 mins ago',
                icon: 'truck',
                iconBg: 'bg-slate-800',
                dotColor: 'bg-orange-500',
                action: ''
            }
        ];

        const container = document.getElementById('notifications-container');

        notifications.forEach(notif => {
            const card = document.createElement('div');
            card.className = "group flex items-center justify-between p-4 bg-white border border-gray-100 rounded-xl shadow-sm hover:shadow-md transition-shadow relative overflow-hidden";
            
            card.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="absolute left-0 w-1 h-12 rounded-r-full ${notif.dotColor} -ml-0.5"></div>
                    <div class="w-1.5 h-1.5 rounded-full ${notif.dotColor} ml-1"></div>
                    
                    <div class="${notif.iconBg} p-2.5 rounded-full text-white">
                        <i data-lucide="${notif.icon}" class="w-6 h-6"></i>
                    </div>

                    <div class="flex flex-col">
                        <h3 class="font-bold text-gray-800 leading-tight">${notif.title}</h3>
                        <p class="text-gray-500 text-sm mt-0.5">${notif.desc}</p>
                    </div>
                </div>

                <div class="flex items-center gap-6">
                    <div class="text-right flex flex-col items-end">
                        <span class="text-blue-900 font-semibold text-sm cursor-pointer hover:underline">${notif.action}</span>
                        <span class="text-gray-400 text-xs mt-1">${notif.time}</span>
                        ${notif.subTime ? `<span class="text-gray-400 text-xs">${notif.subTime}</span>` : ''}
                    </div>
                    <button class="text-gray-300 hover:text-gray-600">
                        <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                    </button>
                </div>
            `;
            container.appendChild(card);
        });

        // Initialize icons
        lucide.createIcons();
    </script>
</body>
</html>
