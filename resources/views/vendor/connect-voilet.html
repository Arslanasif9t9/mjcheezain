<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="mb-8">
                            <h4 class="text-lg font-semibold mb-3">🏦 Bank / Account Connection</h4>

                            <div class="mb-5">
                                <label class="block text-gray-700 font-bold mb-2" for="cnic-number">CNIC Number</label>
                                <input type="text" id="cnic-number" placeholder="XXXXX-XXXXXXX-X" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                            </div>

                            <div class="mb-5">
                                <label class="block text-gray-700 font-bold mb-2">CNIC Front & Back</label>
                                <div class="flex gap-4">
                                    <div class="flex-1">
                                        <label class="block text-gray-700 text-sm mb-1">Front Side</label>
                                        <input type="file" id="cnic-front" accept="image/*" class="block w-full text-sm text-gray-500
                                    file:mr-4 file:py-2 file:px-4
                                    file:rounded-md file:border-0
                                    file:text-sm file:font-semibold
                                    file:bg-green-50 file:text-green-700
                                    hover:file:bg-green-100">
                                        <div class="mt-2 text-center">
                                            <img id="cnic-front-preview" src="" alt="CNIC Front Preview"
                                                class="mx-auto">
                                            <span class="text-gray-500 text-sm">No image selected</span>
                                        </div>
                                    </div>
                                    <div class="flex-1">
                                        <label class="block text-gray-700 text-sm mb-1">Back Side</label>
                                        <input type="file" id="cnic-back" accept="image/*" class="block w-full text-sm text-gray-500
                                    file:mr-4 file:py-2 file:px-4
                                    file:rounded-md file:border-0
                                    file:text-sm file:font-semibold
                                    file:bg-green-50 file:text-green-700
                                    hover:file:bg-green-100">
                                        <div class="mt-2 text-center">
                                            <img id="cnic-back-preview" src="" alt="CNIC Back Preview" class="mx-auto">
                                            <span class="text-gray-500 text-sm">No image selected</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-5">
                                <label class="block text-gray-700 font-bold mb-2" for="bank-name">Bank Name</label>
                                <select id="bank-name" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                                    <option value="">Select Bank</option>
                                    <option value="hbl">HBL</option>
                                    <option value="ubl">UBL</option>
                                    <option value="mcb">MCB</option>
                                    <option value="alfalah">Bank Alfalah</option>
                                </select>
                            </div>

                            <div class="mb-5">
                                <label class="block text-gray-700 font-bold mb-2" for="account-title">Bank Account
                                    Title</label>
                                <input type="text" id="account-title" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                            </div>

                            <div class="mb-5">
                                <label class="block text-gray-700 font-bold mb-2" for="account-number">Bank Account
                                    Number</label>
                                <input type="text" id="account-number" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                            </div>

                            <div class="mb-5">
                                <label class="block text-gray-700 font-bold mb-2" for="iban">IBAN (if
                                    applicable)</label>
                                <input type="text" id="iban"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                            </div>

                            <div class="mb-5">
                                <label class="block text-gray-700 font-bold mb-2" for="payment-gateway">Payment Gateway
                                    (Optional)</label>
                                <select id="payment-gateway"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                                    <option value="">Select Payment Gateway</option>
                                    <option value="easypaisa">Easypaisa</option>
                                    <option value="jazzcash">JazzCash</option>
                                </select>
                            </div>
                        </div>
</body>
</html>
